<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Magazine Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="archive-page">

  <main class="archive-scene" id="archiveScene">

    <!-- ISSUE 01 -->
    <div class="stack-position position-01">
      <article class="poster-stack stack-01">

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover01.jpg"
            alt="Issue 01 cover"
          >
        </div>

      </article>
    </div>

    <!-- ISSUE 02 -->
    <div class="stack-position position-02">
      <article class="poster-stack stack-02">

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover02.jpg"
            alt="Issue 02 cover"
          >
        </div>

      </article>
    </div>

    <!-- ISSUE 03 -->
    <div class="stack-position position-03">
      <article class="poster-stack stack-03">

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover03.jpg"
            alt="Issue 03 cover"
          >
        </div>

      </article>
    </div>

    <!-- ISSUE 04 -->
    <div class="stack-position position-04">
      <article class="poster-stack stack-04">

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover04.jpg"
            alt="Issue 04 cover"
          >
        </div>

      </article>
    </div>

    <!-- ISSUE 05 -->
    <div class="stack-position position-05">
      <article class="poster-stack stack-05">

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover05.jpg"
            alt="Issue 05 cover"
          >
        </div>

      </article>
    </div>

    <!-- ISSUE 06 -->
    <div
      class="stack-position position-06"
      id="issue06Position"
    >
      <article
        class="poster-stack stack-06"
        id="issue06Stack"
        role="button"
        tabindex="0"
        aria-label="Open Issue 06"
      >

        <div class="paper-layer layer-04"></div>
        <div class="paper-layer layer-03"></div>
        <div class="paper-layer layer-02"></div>
        <div class="paper-layer layer-01"></div>

        <div class="stack-cover">
          <img
            src="images/cover06.jpg"
            alt="Issue 06 cover"
          >
        </div>

      </article>
    </div>

  </main>

  <script src="script.js"></script>
</body>

</html>
