<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Magazine Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="archive-page">

  <main id="archive">
    <canvas id="webgl"></canvas>

    <div class="loading-screen" id="loadingScreen">
      <div class="loading-text">LOADING ARCHIVE</div>
      <div class="loading-line">
        <div class="loading-progress" id="loadingProgress"></div>
      </div>
    </div>

    <div class="archive-interface">
      <div class="archive-title">
        X-CHAT ARCHIVE
      </div>

      <div class="archive-hint" id="archiveHint">
        DRAG TO ROTATE · CLICK TO SELECT
      </div>

      <button
        class="close-button"
        id="closeButton"
        type="button"
        aria-label="Close selected issue"
      >
        ×
      </button>

      <div class="selected-information" id="selectedInformation">
        <span id="selectedIssue">ISSUE 06</span>
        <span class="selected-action" id="selectedAction">
          CLICK AGAIN TO OPEN
        </span>
      </div>
    </div>
  </main>

  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
