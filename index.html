<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magazine Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="archive-page">
  <main id="archive" class="archive">
    <canvas id="webgl" aria-label="3D magazine archive"></canvas>

    <div id="loading" class="loading">
      <div class="loading__label">LOADING ARCHIVE</div>
      <div class="loading__track"><div id="loadingBar" class="loading__bar"></div></div>
    </div>

    <div class="ui">
      <div class="ui__title">X-CHAT ARCHIVE</div>
      <div id="hint" class="ui__hint">DRAG TO ROTATE · CLICK A COVER</div>

      <button id="closeSelection" class="close" type="button" aria-label="Close selected cover">×</button>

      <div id="selectionInfo" class="selection-info">
        <div id="selectionIssue" class="selection-info__issue">ISSUE 06</div>
        <div id="selectionAction" class="selection-info__action">CLICK AGAIN TO OPEN</div>
      </div>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
