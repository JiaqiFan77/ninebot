<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Issue 06</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="issue-page">

  <main class="magazine-reader">

    <!-- 返回首页 -->
    <button
      class="reader-home-button"
      type="button"
      aria-label="Back to archive"
      onclick="window.location.href='index.html'"
    >
      ←
    </button>

    <!-- 左侧点击区域 -->
    <button
      class="page-click-area page-click-left"
      type="button"
      aria-label="Previous page"
      onclick="previousPage()"
    ></button>

    <!-- 杂志页 -->
    <section class="page-frame">

      <div class="page-book">

        <!-- 纸张厚度 -->
        <div class="reader-page-stack"></div>

        <div
          class="turning-page"
          id="turningPage"
        >
          <img
            id="magazineImage"
            src="images/issue06-page01.jpg"
            alt="Issue 06 page 1"
          >
        </div>

      </div>

    </section>

    <!-- 右侧点击区域 -->
    <button
      class="page-click-area page-click-right"
      type="button"
      aria-label="Next page"
      onclick="nextPage()"
    ></button>

    <!-- 左右按钮 -->
    <button
      class="reader-nav-button reader-previous"
      type="button"
      aria-label="Previous page"
      onclick="previousPage()"
    >
      ←
    </button>

    <button
      class="reader-nav-button reader-next"
      type="button"
      aria-label="Next page"
      onclick="nextPage()"
    >
      →
    </button>

    <!-- 页码 -->
    <div
      class="reader-page-number"
      id="pageNumber"
    >
      01 / 05
    </div>

  </main>

  <script src="issue6.js"></script>
</body>

</html>
